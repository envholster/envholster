name: Feature request
description: Suggest something Env Holster should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        [PLAN.md](https://github.com/envholster/envholster/blob/main/PLAN.md) describes what is planned next.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem and your workflow today, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Env Holster to do?
    validations:
      required: true
