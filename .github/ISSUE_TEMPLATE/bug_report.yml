name: Bug report
description: Something behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a secret value or the contents of `secrets.holster` here.
        Security issues go through [private reporting](https://github.com/envholster/envholster/security/advisories/new), not this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. envholster init
        2. envholster import .env --encrypt-all
        3. envholster run -- npm run dev
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: The failing command and its output, with any values redacted.
      render: console
  - type: textarea
    id: doctor
    attributes:
      label: envholster doctor
      description: Output of `envholster doctor`, which never prints values.
      render: console
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `envholster --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.5 (Apple silicon) / Ubuntu 24.04 (x86-64)
    validations:
      required: true
